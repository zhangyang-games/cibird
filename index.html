<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CiBird 词鸟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --paper: #f5f3ee;
    --accent: #1a1a1a;
    --muted: #888;
    --border: #d4d0c8;
    --hover: #e8e5de;
    --danger: #c0392b;
    --success: #27ae60;
    --card-shadow: 2px 4px 0px #0a0a0a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }

  #login-screen::before {
    content: 'CIBIRD';
    position: absolute;
    font-family: 'DM Serif Display', serif;
    font-size: 30vw;
    color: rgba(0,0,0,0.04);
    letter-spacing: -0.02em;
    pointer-events: none;
    white-space: nowrap;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .login-box {
    background: white;
    border: 2px solid var(--ink);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--card-shadow);
    position: relative;
    z-index: 1;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .login-bird {
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .login-title {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    text-align: center;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }

  .login-sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
  }

  .field-label {
    font-size: 0.7rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
    display: block;
  }

  .field-wrap { margin-bottom: 1.2rem; }

  input[type="text"], input[type="password"] {
    width: 100%;
    border: 2px solid var(--border);
    background: var(--paper);
    padding: 0.75rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--ink); }

  .btn-primary {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 0.8rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 0.5rem;
  }

  .btn-primary:hover { background: #333; }
  .btn-primary:active { transform: translateY(1px); }

  .error-msg {
    color: var(--danger);
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    margin-top: 0.75rem;
    text-align: center;
    min-height: 1.2em;
  }

  /* ── APP SHELL ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* TOP BAR */
  .topbar {
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1rem;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .topbar-actions { display: flex; gap: 0.5rem; align-items: center; }

  .topbar-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--paper);
    padding: 0.3rem 0.7rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }

  .topbar-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--paper); }

  /* ── MAIN / WORD LIST ── */
  #view-list {
    flex: 1;
    padding: 1.2rem 1rem 6rem;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .list-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.2rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--ink);
  }

  .list-count {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .search-bar {
    display: flex;
    gap: 0;
    margin-bottom: 1rem;
  }

  .search-bar input {
    flex: 1;
    border: 2px solid var(--border);
    background: white;
    padding: 0.6rem 0.9rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-bar input:focus { border-color: var(--ink); }

  .word-card {
    background: white;
    border: 2px solid var(--ink);
    padding: 1rem 1.1rem;
    margin-bottom: 0.6rem;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 2px 2px 0px var(--ink);
    position: relative;
    overflow: hidden;
  }

  .word-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--ink);
    transform: scaleY(0);
    transition: transform 0.15s;
    transform-origin: bottom;
  }

  .word-card:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--ink); }
  .word-card:hover::before { transform: scaleY(1); }
  .word-card:active { transform: translate(0,0); box-shadow: 1px 1px 0px var(--ink); }

  .word-en {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .word-pos {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  .word-zh {
    font-size: 0.85rem;
    color: #555;
    margin-top: 0.2rem;
    line-height: 1.4;
  }

  .word-card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.3rem;
    flex-shrink: 0;
    margin-left: 1rem;
  }

  .word-phonetic {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .word-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    background: var(--ink);
    color: var(--paper);
    padding: 0.15rem 0.4rem;
    letter-spacing: 0.06em;
  }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 56px;
    height: 56px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-size: 1.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
    transition: all 0.15s;
    z-index: 50;
    border: 2px solid var(--ink);
  }

  .fab:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0px rgba(0,0,0,0.3); }
  .fab:active { transform: translate(1px,1px); box-shadow: 1px 1px 0px rgba(0,0,0,0.3); }

  /* ── ADD WORD MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    justify-content: flex-end;
    align-items: stretch;
  }

  .modal-overlay.open { display: flex; }

  .modal-panel {
    background: var(--paper);
    width: 100%;
    max-width: 480px;
    height: 100%;
    overflow-y: auto;
    border-left: 2px solid var(--ink);
    display: flex;
    flex-direction: column;
    animation: slideInRight 0.25s ease;
  }

  @keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  .modal-header {
    background: var(--ink);
    color: var(--paper);
    padding: 1rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
  }

  .close-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    color: var(--paper);
    width: 32px;
    height: 32px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .close-btn:hover { background: rgba(255,255,255,0.1); }

  .modal-body { padding: 1.2rem; flex: 1; }

  .input-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1rem;
    align-items: flex-end;
  }

  .input-row .field-wrap { flex: 1; margin-bottom: 0; }

  .btn-ai {
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 0.75rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .btn-ai:hover { background: #333; }
  .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }

  .ai-loading {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.75rem 0;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  textarea {
    width: 100%;
    border: 2px solid var(--border);
    background: white;
    padding: 0.75rem 1rem;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.9rem;
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 80px;
    line-height: 1.6;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: var(--ink); }

  .ai-result-block {
    background: white;
    border: 2px solid var(--ink);
    padding: 1rem;
    margin-bottom: 1rem;
    display: none;
  }

  .ai-result-block.visible { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .result-section {
    margin-bottom: 0.8rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px dashed var(--border);
  }

  .result-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  .result-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }

  .result-text { font-size: 0.9rem; line-height: 1.6; }

  .example-en { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 1rem; margin-bottom: 0.15rem; }
  .example-zh { font-size: 0.8rem; color: #555; }

  .modal-footer {
    padding: 1rem 1.2rem;
    border-top: 2px solid var(--border);
    display: flex;
    gap: 0.6rem;
    flex-shrink: 0;
    background: var(--paper);
  }

  .btn-save {
    flex: 1;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 0.8rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-save:hover { background: #333; }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-cancel {
    background: none;
    color: var(--ink);
    border: 2px solid var(--border);
    padding: 0.8rem 1.2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-cancel:hover { border-color: var(--ink); }

  /* ── DETAIL VIEW ── */
  #view-detail {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }

  .detail-back {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.8rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    background: white;
    transition: color 0.15s;
    letter-spacing: 0.05em;
  }

  .detail-back:hover { color: var(--ink); }

  .detail-hero {
    background: var(--ink);
    color: var(--paper);
    padding: 2rem 1.5rem 1.5rem;
    position: relative;
    overflow: hidden;
  }

  .detail-hero::after {
    content: attr(data-word);
    position: absolute;
    right: -0.1em;
    bottom: -0.3em;
    font-family: 'DM Serif Display', serif;
    font-size: 5rem;
    opacity: 0.07;
    letter-spacing: -0.03em;
    pointer-events: none;
    line-height: 1;
    text-transform: uppercase;
  }

  .detail-word {
    font-family: 'DM Serif Display', serif;
    font-size: 2.8rem;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 0.5rem;
  }

  .detail-meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .detail-phonetic {
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    opacity: 0.7;
  }

  .detail-pos {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 0.15rem 0.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .speak-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    color: var(--paper);
    padding: 0.3rem 0.7rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .speak-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--paper); }

  .detail-body {
    padding: 1.2rem 1rem;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .detail-section {
    background: white;
    border: 2px solid var(--ink);
    padding: 1.1rem;
    margin-bottom: 0.8rem;
    box-shadow: 2px 2px 0px var(--ink);
  }

  .detail-section-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .detail-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .detail-meaning { font-size: 1.05rem; line-height: 1.7; }

  .example-item { margin-bottom: 0.8rem; }
  .example-item:last-child { margin-bottom: 0; }

  .example-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 0.2rem;
  }

  .example-en-detail {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.1rem;
    line-height: 1.5;
    margin-bottom: 0.2rem;
  }

  .example-zh-detail { font-size: 0.85rem; color: #555; line-height: 1.5; }

  .note-area {
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.9rem;
    color: var(--ink);
    outline: none;
    resize: none;
    min-height: 80px;
    line-height: 1.7;
  }

  .note-area::placeholder { color: var(--border); }

  .detail-actions {
    display: flex;
    gap: 0.6rem;
    padding: 1rem;
    border-top: 2px solid var(--border);
    background: var(--paper);
    position: sticky;
    bottom: 0;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .btn-outline {
    flex: 1;
    background: none;
    border: 2px solid var(--ink);
    color: var(--ink);
    padding: 0.7rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }

  .btn-outline:hover { background: var(--ink); color: var(--paper); }

  .btn-danger {
    background: none;
    border: 2px solid var(--danger);
    color: var(--danger);
    padding: 0.7rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }

  .btn-danger:hover { background: var(--danger); color: white; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 0.6rem 1.2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    opacity: 0;
    transition: all 0.25s;
    z-index: 999;
    pointer-events: none;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }

  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
  .empty-state p { font-family: 'DM Mono', monospace; font-size: 0.8rem; letter-spacing: 0.05em; line-height: 1.8; }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .modal-panel { max-width: 100%; border-left: none; }
    .detail-word { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-bird">🦜</div>
    <div class="login-title">CiBird</div>
    <div class="login-sub">词鸟 · 你的英语单词本</div>
    <div class="field-wrap">
      <label class="field-label">用户名</label>
      <input type="text" id="login-user" autocomplete="username" placeholder="admin">
    </div>
    <div class="field-wrap">
      <label class="field-label">密码</label>
      <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••">
    </div>
    <button class="btn-primary" onclick="doLogin()">进入词鸟 →</button>
    <div class="error-msg" id="login-err"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-title">🦜 CiBird</div>
    <div class="topbar-actions">
      <span id="word-count-top" style="font-family:'DM Mono',monospace;font-size:0.75rem;color:rgba(255,255,255,0.5);letter-spacing:0.05em;"></span>
      <button class="topbar-btn" onclick="doLogout()">退出</button>
    </div>
  </div>

  <!-- VIEW: LIST -->
  <div id="view-list">
    <div class="list-header">
      <div style="font-family:'DM Serif Display',serif;font-size:1.3rem;letter-spacing:-0.01em;">我的词库</div>
      <div class="list-count" id="list-count-label">0 个单词</div>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="搜索单词或释义..." oninput="filterWords()">
    </div>
    <div id="word-list"></div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openAdd()" title="添加单词">＋</button>

  <!-- VIEW: DETAIL -->
  <div id="view-detail">
    <div class="detail-back" onclick="showList()">← 返回词库</div>
    <div class="detail-hero" id="detail-hero">
      <div class="detail-word" id="detail-word"></div>
      <div class="detail-meta">
        <span class="detail-phonetic" id="detail-phonetic"></span>
        <span class="detail-pos" id="detail-pos"></span>
        <button class="speak-btn" onclick="speakWord()" id="speak-btn">▶ 发音</button>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-section">
        <div class="detail-section-title">中文释义</div>
        <div class="detail-meaning" id="detail-meaning"></div>
      </div>
      <div class="detail-section" id="detail-examples-sec">
        <div class="detail-section-title">例句</div>
        <div id="detail-examples"></div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">我的笔记</div>
        <textarea class="note-area" id="detail-note" placeholder="在这里记下你对这个词的理解、记忆方法、或者在哪里遇见过它…" onchange="saveNote()"></textarea>
      </div>
    </div>
    <div class="detail-actions">
      <button class="btn-outline" onclick="regenExamples()">✦ 重新造句</button>
      <button class="btn-danger" onclick="deleteWord()">删除</button>
    </div>
  </div>

</div>

<!-- ══ ADD MODAL ══ -->
<div class="modal-overlay" id="add-modal">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title">添加单词</div>
      <button class="close-btn" onclick="closeAdd()">✕</button>
    </div>
    <div class="modal-body">
      <div class="input-row">
        <div class="field-wrap">
          <label class="field-label">英文单词</label>
          <input type="text" id="input-word" placeholder="例如：resilient" oninput="onWordInput()" autocomplete="off">
        </div>
        <button class="btn-ai" id="btn-generate" onclick="generateAI()" disabled>
          ✦ AI造句
        </button>
      </div>
      <div id="ai-loading" style="display:none">
        <div class="ai-loading">
          <div class="spinner"></div>
          <span>AI正在帮你造句，稍等一秒…</span>
        </div>
      </div>
      <div class="ai-result-block" id="ai-result">
        <div class="result-section">
          <div class="result-label">释义</div>
          <div class="result-text" id="res-meaning"></div>
        </div>
        <div class="result-section">
          <div class="result-label">音标 / 词性</div>
          <div class="result-text" style="font-family:'DM Mono',monospace;font-size:0.85rem;">
            <span id="res-phonetic"></span>&nbsp;&nbsp;<span id="res-pos" style="color:var(--muted)"></span>
          </div>
        </div>
        <div class="result-section">
          <div class="result-label">例句①</div>
          <div class="example-en" id="res-ex1-en"></div>
          <div class="example-zh" id="res-ex1-zh"></div>
        </div>
        <div class="result-section">
          <div class="result-label">例句②</div>
          <div class="example-en" id="res-ex2-en"></div>
          <div class="example-zh" id="res-ex2-zh"></div>
        </div>
      </div>
      <div class="field-wrap">
        <label class="field-label">个人笔记（可选）</label>
        <textarea id="input-note" placeholder="在哪遇见的？有什么联想记忆法？"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeAdd()">取消</button>
      <button class="btn-save" id="btn-save" onclick="saveWord()" disabled>保存到词库</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let token = null;
let words = [];
let currentWordId = null;
let aiData = null;

// ═══════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════
async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  const err = document.getElementById('login-err');
  if (!u || !p) { err.textContent = '请填写用户名和密码'; return; }
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || '密码错误'; return; }
    token = d.token;
    localStorage.setItem('cb_token', token);
    showApp();
  } catch(e) {
    err.textContent = '无法连接服务器';
  }
}

function doLogout() {
  token = null;
  localStorage.removeItem('cb_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  const saved = localStorage.getItem('cb_token');
  if (saved) {
    token = saved;
    const ok = await loadWords();
    if (ok) { showApp(); return; }
    token = null; localStorage.removeItem('cb_token');
  }

  // Enter key for login
  ['login-user','login-pass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
});

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  loadWords();
  showList();
}

// ═══════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════
function authHeaders() {
  return {'Content-Type':'application/json','Authorization':'Bearer '+token};
}

async function loadWords() {
  try {
    const r = await fetch('/api/words', {headers: authHeaders()});
    if (r.status === 401) return false;
    words = await r.json();
    renderWordList(words);
    updateCounts();
    return true;
  } catch(e) { return false; }
}

// ═══════════════════════════════════════════
//  VIEWS
// ═══════════════════════════════════════════
function showList() {
  document.getElementById('view-list').style.display = 'block';
  document.getElementById('view-detail').style.display = 'none';
  document.querySelector('.fab').style.display = 'flex';
}

function showDetail(id) {
  const w = words.find(x => x.id === id);
  if (!w) return;
  currentWordId = id;

  document.getElementById('view-list').style.display = 'none';
  document.getElementById('view-detail').style.display = 'flex';
  document.querySelector('.fab').style.display = 'none';

  document.getElementById('detail-hero').setAttribute('data-word', w.word.toUpperCase());
  document.getElementById('detail-word').textContent = w.word;
  document.getElementById('detail-phonetic').textContent = w.phonetic || '';
  document.getElementById('detail-pos').textContent = w.pos || '';
  document.getElementById('detail-meaning').textContent = w.meaning || '';
  document.getElementById('detail-note').value = w.note || '';

  // Examples
  const exEl = document.getElementById('detail-examples');
  exEl.innerHTML = '';
  const exArr = w.examples || [];
  exArr.forEach((ex, i) => {
    exEl.innerHTML += `
      <div class="example-item">
        <div class="example-num">例句 ${i+1}</div>
        <div class="example-en-detail">${ex.en || ''}</div>
        <div class="example-zh-detail">${ex.zh || ''}</div>
      </div>`;
  });
  if (!exArr.length) exEl.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;font-family:DM Mono,monospace;">暂无例句，返回列表页可重新造句</div>';

  document.getElementById('view-detail').scrollTop = 0;
}

// ═══════════════════════════════════════════
//  WORD LIST RENDER
// ═══════════════════════════════════════════
function renderWordList(list) {
  const el = document.getElementById('word-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🦜</div>
      <p>词库还是空的<br>点右下角 ＋ 添加你的第一个单词</p>
    </div>`;
    return;
  }
  el.innerHTML = list.map(w => `
    <div class="word-card" onclick="showDetail(${w.id})">
      <div>
        <div>
          <span class="word-en">${escHtml(w.word)}</span>
          <span class="word-pos">${escHtml(w.pos||'')}</span>
        </div>
        <div class="word-zh">${escHtml(w.meaning||'')}</div>
      </div>
      <div class="word-card-right">
        <span class="word-phonetic">${escHtml(w.phonetic||'')}</span>
      </div>
    </div>
  `).join('');
}

function filterWords() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  if (!q) { renderWordList(words); return; }
  renderWordList(words.filter(w =>
    w.word.toLowerCase().includes(q) ||
    (w.meaning||'').toLowerCase().includes(q) ||
    (w.note||'').toLowerCase().includes(q)
  ));
}

function updateCounts() {
  const n = words.length;
  document.getElementById('list-count-label').textContent = n + ' 个单词';
  document.getElementById('word-count-top').textContent = n + ' words';
}

// ═══════════════════════════════════════════
//  ADD MODAL
// ═══════════════════════════════════════════
function openAdd() {
  document.getElementById('add-modal').classList.add('open');
  aiData = null;
  document.getElementById('input-word').value = '';
  document.getElementById('input-note').value = '';
  document.getElementById('ai-result').classList.remove('visible');
  document.getElementById('ai-loading').style.display = 'none';
  document.getElementById('btn-generate').disabled = true;
  document.getElementById('btn-save').disabled = true;
  setTimeout(() => document.getElementById('input-word').focus(), 100);
}

function closeAdd() {
  document.getElementById('add-modal').classList.remove('open');
}

function onWordInput() {
  const val = document.getElementById('input-word').value.trim();
  document.getElementById('btn-generate').disabled = !val;
  if (!val) {
    document.getElementById('ai-result').classList.remove('visible');
    document.getElementById('btn-save').disabled = true;
    aiData = null;
  }
}

async function generateAI() {
  const word = document.getElementById('input-word').value.trim();
  if (!word) return;

  document.getElementById('ai-loading').style.display = 'block';
  document.getElementById('ai-result').classList.remove('visible');
  document.getElementById('btn-generate').disabled = true;
  document.getElementById('btn-save').disabled = true;
  aiData = null;

  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({word})
    });
    const d = await r.json();
    if (!r.ok) { showToast('AI出错了：' + (d.detail||'未知错误')); return; }

    aiData = d;
    document.getElementById('res-meaning').textContent = d.meaning || '';
    document.getElementById('res-phonetic').textContent = d.phonetic || '';
    document.getElementById('res-pos').textContent = d.pos || '';
    document.getElementById('res-ex1-en').textContent = (d.examples&&d.examples[0]) ? d.examples[0].en : '';
    document.getElementById('res-ex1-zh').textContent = (d.examples&&d.examples[0]) ? d.examples[0].zh : '';
    document.getElementById('res-ex2-en').textContent = (d.examples&&d.examples[1]) ? d.examples[1].en : '';
    document.getElementById('res-ex2-zh').textContent = (d.examples&&d.examples[1]) ? d.examples[1].zh : '';

    document.getElementById('ai-result').classList.add('visible');
    document.getElementById('btn-save').disabled = false;
  } catch(e) {
    showToast('网络错误，请重试');
  } finally {
    document.getElementById('ai-loading').style.display = 'none';
    document.getElementById('btn-generate').disabled = false;
  }
}

// Allow Enter to trigger AI
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('input-word').addEventListener('keydown', e => {
    if (e.key === 'Enter') generateAI();
  });
});

async function saveWord() {
  const word = document.getElementById('input-word').value.trim();
  if (!word || !aiData) return;
  const note = document.getElementById('input-note').value.trim();
  try {
    const r = await fetch('/api/words', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        word, note,
        meaning: aiData.meaning||'',
        phonetic: aiData.phonetic||'',
        pos: aiData.pos||'',
        examples: aiData.examples||[]
      })
    });
    if (!r.ok) { showToast('保存失败'); return; }
    closeAdd();
    await loadWords();
    showToast('✓ 已加入词库：' + word);
  } catch(e) {
    showToast('网络错误');
  }
}

// ═══════════════════════════════════════════
//  DETAIL ACTIONS
// ═══════════════════════════════════════════
function speakWord() {
  const w = document.getElementById('detail-word').textContent;
  if (!w || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(w);
  u.lang = 'en-US'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

async function saveNote() {
  const note = document.getElementById('detail-note').value;
  if (!currentWordId) return;
  try {
    await fetch('/api/words/' + currentWordId + '/note', {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({note})
    });
    const w = words.find(x => x.id === currentWordId);
    if (w) w.note = note;
    showToast('笔记已保存');
  } catch(e) {}
}

async function regenExamples() {
  const w = words.find(x => x.id === currentWordId);
  if (!w) return;
  showToast('AI重新造句中…');
  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({word: w.word})
    });
    const d = await r.json();
    if (!r.ok) { showToast('AI出错了'); return; }
    // Update examples in DB
    await fetch('/api/words/' + currentWordId + '/examples', {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({examples: d.examples||[]})
    });
    w.examples = d.examples || [];
    showDetail(currentWordId);
    showToast('✓ 例句已更新');
  } catch(e) { showToast('网络错误'); }
}

async function deleteWord() {
  if (!currentWordId) return;
  const w = words.find(x => x.id === currentWordId);
  if (!confirm('确定删除「' + (w?w.word:'') + '」？')) return;
  try {
    await fetch('/api/words/' + currentWordId, {
      method: 'DELETE',
      headers: authHeaders()
    });
    await loadWords();
    showList();
    showToast('已删除');
  } catch(e) { showToast('删除失败'); }
}

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// Close modal on overlay click
document.getElementById('add-modal').addEventListener('click', function(e) {
  if (e.target === this) closeAdd();
});
</script>
</body>
</html>
